<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Attendify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="brand-lockup">
        <span class="brand-mark"><i class="fa-solid fa-fingerprint" aria-hidden="true"></i></span>
        <div class="brand-copy">
          <h1 id="loginTitle">Attendify</h1>
          <p>Lecturer dashboard access</p>
        </div>
      </div>

      <form id="loginForm" class="form-grid" novalidate>
        <div id="loginMessage" class="message error" role="alert"></div>

        <div class="field">
          <label for="staffId">Staff ID</label>
          <input class="input" id="staffId" name="staffId" type="text" autocomplete="username" value="admin" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button class="btn btn-primary" type="submit">
          <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
          Sign in
        </button>
      </form>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
