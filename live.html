<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Monitor | Attendify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand-lockup" href="live.html">
        <span class="brand-mark"><i class="fa-solid fa-fingerprint" aria-hidden="true"></i></span>
        <span class="brand-copy">
          <h1>Attendify</h1>
          <p>University attendance system</p>
        </span>
      </a>
      <div class="user-area">
        <span class="lecturer-pill"><i class="fa-solid fa-user-tie" aria-hidden="true"></i><span data-lecturer-name></span></span>
        <button class="btn btn-secondary" type="button" data-logout><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>Logout</button>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar" aria-label="Dashboard navigation">
        <a class="nav-link" data-nav="live" href="live.html"><i class="fa-solid fa-tower-broadcast" aria-hidden="true"></i><span>Live Monitor</span></a>
        <a class="nav-link" data-nav="schedules" href="schedules.html"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i><span>Schedules</span></a>
        <a class="nav-link" data-nav="students" href="students.html"><i class="fa-solid fa-users" aria-hidden="true"></i><span>Students</span></a>
        <a class="nav-link" data-nav="analytics" href="analytics.html"><i class="fa-solid fa-chart-column" aria-hidden="true"></i><span>Analytics</span></a>
      </nav>

      <main class="content">
        <div class="page-header">
          <div class="page-title">
            <h1>Live Monitor</h1>
            <p>Attendance feed refreshes automatically every 3 seconds.</p>
          </div>
          <span id="refreshStatus" class="status-line">Waiting for first refresh</span>
        </div>

        <section class="challenge-card" id="challengeCard" hidden aria-live="polite">
          <div>
            <span class="challenge-label">Active Re-verification Code</span>
            <strong id="challengeCode">----</strong>
          </div>
          <span id="challengeExpiry">Expires soon</span>
        </section>

        <div id="liveMessage" class="message" role="status"></div>

        <section class="card" aria-labelledby="liveTableTitle">
          <div class="card-header">
            <h2 id="liveTableTitle"><i class="fa-solid fa-eye" aria-hidden="true"></i> Real-time attendance</h2>
            <button class="btn btn-secondary" type="button" id="refreshNow"><i class="fa-solid fa-rotate" aria-hidden="true"></i>Refresh</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Check-in Time</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="liveRows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="common.js"></script>
  <script src="live.js"></script>
</body>
</html>
